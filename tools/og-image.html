<!doctype html>
<!--
  Source for public/og-image.png (1200x630) and public/apple-touch-icon.png.

  Rendered once by hand, not at build time — see tools/README.md. Colours are
  the design tokens from src/styles/global.css and the mark is the official
  Adventist symbol, the same file as src/assets/sda-symbol.svg, so the card stays consistent with the site without
  inventing any brand asset the church hasn't given us.

  Replace this with a photograph of the building when one arrives; the card is
  a placeholder for a photo, not a permanent design.
-->
<html lang="af">
  <head>
    <meta charset="utf-8" />
    <!-- FONT_CSS -->
    <style>
      :root {
        --navy: #0b3d54;
        --navy-deep: #072a3b;
        --orange: #e8862c;
        --cream: #f6f2e9;
        --tan-border: #e2d5bd;
        --ink: #17252e;
        --slate: #3f4d55;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        background: var(--cream);
        font-family: 'Public Sans', system-ui, sans-serif;
        color: var(--ink);
        overflow: hidden;
      }

      #card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        position: relative;
      }

      /* Same navy band the site uses under the hero, anchoring the card. */
      #card::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 96px;
        background: var(--navy);
      }

      .mark {
        width: 104px;
        height: 104px;
        margin-bottom: 34px;
      }

      .eyebrow {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--orange);
        margin-bottom: 18px;
      }

      h1 {
        font-family: 'Newsreader', serif;
        font-weight: 500;
        font-size: 86px;
        line-height: 1.04;
        letter-spacing: -0.015em;
        color: var(--navy);
        margin-bottom: 20px;
      }

      .address {
        font-size: 26px;
        color: var(--slate);
        margin-bottom: 46px;
      }

      .times {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 0;
        height: 96px;
        display: flex;
        align-items: center;
        gap: 44px;
        z-index: 1;
        color: var(--cream);
        font-size: 21px;
      }

      .times b {
        font-weight: 700;
        color: #fff;
      }

      .times .sep {
        width: 1px;
        height: 26px;
        background: rgba(246, 242, 233, 0.28);
      }
    </style>
  </head>
