name: Deploy production (Cloudflare)

# Gated on `main`: production only deploys once a dev -> main promotion PR
# merges (see README "Branch strategy"), plus manual dispatch for a re-deploy
# without a new merge. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts + Account Settings: Read/Edit)
#   CLOUDFLARE_ACCOUNT_ID
# Set via Settings -> Secrets and variables -> Actions.
#
# Two further repo secrets feed the LIVE badge:
#   YOUTUBE_API_KEY
#   YOUTUBE_CHANNEL_ID
# The deploy step uploads them to the Worker (see `secrets:` below). Both must
# be present: the step passes them by name, so removing one from repo settings
# without also removing it here uploads an empty value.
#
# The contact secrets — CONTACT_EMAIL_TO, CONTACT_EMAIL_FROM and
# CONTACT_WEBHOOK_URL — are deliberately NOT listed below. They are optional
# (either channel alone works), and that same by-name behaviour would blank a
# working dashboard value on every deploy where the repo secret is unset. Set
# them in the Cloudflare dashboard or with `wrangler secret put` instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # `contents: write` so a successful deploy can create the release tag.
  # `deployments: write` for the `environment:` block below, which is what
  # populates the repo's Environments tab.
  contents: write
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Records each run in the Environments tab with a link to the live site, so
    # "what is deployed right now" is answerable from GitHub. Costs nothing and
    # needs no third-party action.
    environment:
      name: production
      url: https://tygerberg-sda.cloudkid.link
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: `gh release create --generate-notes` needs the previous
          # tag to diff against, and a shallow clone has neither tags nor commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # `cache: npm` restores ~/.npm (the tarball cache) keyed on
          # package-lock.json. This is the caching layer that matters here —
          # it is what keeps the install below in single-digit seconds.
          #
          # Deliberately NOT caching node_modules on top of it: the tree is
          # ~400 MB across 213 packages, so compressing, uploading and
          # re-extracting it costs more wall-clock than the install it would
          # replace, and it bypasses npm's integrity checks. Measured on run
          # 30167125441: install 6s, build 1s, whole job 23s.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        # --prefer-offline: use the restored tarballs instead of revalidating
        # every package against the registry. --no-audit/--fund: drop two
        # network round-trips whose output nothing here reads.
        run: npm ci --prefer-offline --no-audit --fund=false

      # `package.json` is the single source of truth for the released version.
      # A deploy whose version already has a tag is a re-deploy, not a release —
      # it still ships, it just does not tag or release again. So the way to cut
      # a release is to bump the version in the promotion PR; forget to, and
      # production still updates, quietly and without a new tag.
      - name: Resolve version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released — deploying without tagging."
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is new — a release will be cut after a successful deploy."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build (root base path)
        run: npm run build
        env:
          # Stamped into the build so a served page can say which release it came
          # from. Read via import.meta.env in src/layouts/Layout.astro, which
          # emits them as <meta> tags. See README "Versioning and releases".
          PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
          PUBLIC_APP_COMMIT: ${{ github.sha }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Names only. The action runs `wrangler secret put` for each before
          # deploying, reading the value from this step's `env` below.
          #
          # This is the bridge between the two kinds of secret, and it is easy
          # to get wrong: an Actions secret is visible to the workflow, not to
          # the Worker. `src/worker/liveStatus.ts` reads these off the Worker's
          # runtime `env`, so without this block they are set in GitHub, absent
          # in production, and the LIVE badge stays hidden with no error
          # anywhere to explain why.
          secrets: |
            YOUTUBE_API_KEY
            YOUTUBE_CHANNEL_ID
        env:
          # Scoped to this step, so the key is never present during
          # `npm run build` above and cannot reach the client bundle.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

      # Only after Cloudflare has accepted the deploy. Tagging first would leave
      # a tag claiming to be live when the deploy failed, which is worse than no
      # tag at all — the tag is the record of what production is actually
      # serving, and it has to stay true to that.
      - name: Tag and release
        if: steps.version.outputs.fresh == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --generate-notes
          echo "::notice::Released v$version -> https://tygerberg-sda.cloudkid.link"
        env:
          GH_TOKEN: ${{ github.token }}
