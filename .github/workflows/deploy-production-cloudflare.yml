name: Deploy production (Cloudflare)

# Gated on `main`: production only deploys once a dev -> main promotion PR
# merges (see README "Branch strategy"), plus manual dispatch for a re-deploy
# without a new merge. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts + Account Settings: Read/Edit)
#   CLOUDFLARE_ACCOUNT_ID
# Set via Settings -> Secrets and variables -> Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (root base path)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
