name: Deploy devtest (GitHub Pages)

# Free, no-secrets-required preview build. Static only — the /api/* routes
# from src/worker/ aren't available here (that needs the Cloudflare Worker,
# see deploy-production-cloudflare.yml).
#
# Triggers off `dev`, the integration branch — feature PRs merge here first
# for preview, then a dev -> main PR gates promotion to production (see
# README "Branch strategy").
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Restores ~/.npm keyed on package-lock.json. See the production
          # workflow for why node_modules itself is not cached on top.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build (base path = /${{ github.event.repository.name }}/)
        run: npm run build
        env:
          ASTRO_BASE: /${{ github.event.repository.name }}/
          # No Worker on Pages, so /api/live-status doesn't exist here. Skip
          # the poll rather than 404 on a loop; the LIVE badge simply never
          # shows on devtest.
          PUBLIC_HAS_API: 'false'
          # This preview is served from a public github.io URL, and robots.txt
          # can't reach it — that file is only honoured at a domain root, and
          # the root here belongs to github.io. A noindex meta is the only way
          # to keep the preview out of search results and stop it competing
          # with production. Unset elsewhere, so production indexes normally.
          PUBLIC_INDEXABLE: 'false'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
