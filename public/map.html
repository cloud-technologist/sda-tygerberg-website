<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tygerberg SDA Church — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { width: 100%; height: 100%; }
  .leaflet-popup-content { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13.5px; color: #17252e; }
  .leaflet-popup-content b { color: #0b3d54; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const lat = -33.8974, lng = 18.6235;
  const map = L.map('map', { scrollWheelZoom: false }).setView([lat, lng], 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);
  L.marker([lat, lng]).addTo(map)
    .bindPopup('<b>Tygerberg SDA Church</b><br>54 Boston St, Boston, Cape Town, 7530')
    .openPopup();
</script>
</body>
</html>
