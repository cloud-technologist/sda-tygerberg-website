<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tygerberg SDA Church — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { width: 100%; height: 100%; background: #eee7d8; }
  .leaflet-popup-content { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13.5px; color: #17252e; }
  .leaflet-popup-content b { color: #0b3d54; }

  /* The church's symbol, not Leaflet's teardrop. The cream ring lifts the navy
     disc off tiles that run from pale road fill to mid-green parkland. */
  .church-marker {
    border-radius: 50%;
    background: #f6f2e9;
    box-shadow: 0 2px 8px rgba(7, 42, 59, .45);
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const lat = -33.8974, lng = 18.6235;

  /* One-finger drag off on touch, wheel never zooms — CONCERNS.md C-28.
     Mouse dragging stays on; a desktop drag doesn't compete with page scroll. */
  const map = L.map('map', {
    scrollWheelZoom: false,
    dragging: !L.Browser.mobile,
    tap: false,
    // Off the tiles on purpose — the credit is rendered adjacent to the map by
    // VisitMap.tsx instead, which the OSMF guidelines allow. C-01.
    attributionControl: false
  }).setView([lat, lng], 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  // A committed derivation of the official mark; a relative path resolves at
  // both the domain root and the Pages base. Not favicon.svg — that one carries
  // a plate the marker does not need (C-27).
  const icon = L.icon({
    iconUrl: 'map-marker.svg',
    iconSize: [40, 40],
    iconAnchor: [20, 20],
    popupAnchor: [0, -18],
    className: 'church-marker'
  });

  L.marker([lat, lng], { icon, alt: 'Tygerberg SDA Church' }).addTo(map)
    .bindPopup('<b>Tygerberg SDA Church</b><br>54 Boston St, Boston, Cape Town, 7530')
    .openPopup();
</script>
</body>
</html>
